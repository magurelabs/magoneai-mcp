[project]
name = "magone-mcp-core"
version = "0.1.0"
description = "A thin layer over the official MCP Python SDK for building connectors"
readme = "README.md"
# 3.11, not 3.10. Every CI job pins 3.11 and both Dockerfiles pin the
# 3.11-slim digest, so 3.10 and 3.12 were a support claim with no evidence
# behind it on a package about to go on PyPI. Widen this when a CI matrix
# proves the wider range, not before.
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "model-context-protocol", "connector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  # Pinned to the 2.x line deliberately. `pip install mcp` now resolves to 2.x,
  # and 1.x has a different module layout (FastMCP rather than MCPServer), so
  # an unpinned dependency would resolve differently depending on when it ran.
  "mcp>=2.2.0,<3",
  "httpx>=0.27",
  "structlog>=24.1",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff==0.16.1",
]

# Per-connector dependencies.
#
# `magone-mcp-core` itself deliberately depends on almost nothing: the SDK, an
# HTTP client and a logger. A connector that talks to Oracle should not drag
# `oracledb` into an install that only wanted to search the web.
#
# So each connector needing a third-party library declares it here, and a
# source checkout installs it by name:
#
#     pip install -e ".[web_search]"
#     pip install -e ".[database,outlook_email]"
#
# The wheel itself ships only `magone_mcp_core`; connectors run from a
# checkout of this repository.
#
# Version floors are carried across from the pre-port per-server
# `requirements.txt` files rather than chosen fresh, so an install resolves to
# something the connector has actually run against.
#
# Found by installing the package into an empty virtualenv and starting each
# connector: only 10 of 23 came up, and `web_search` failed on `trafilatura`
# with nothing anywhere declaring it.
cloudflare_r2 = ["aioboto3>=13.0.0", "botocore"]
# Floors from the pip freeze of the v1 image each was recovered from.
csv_to_sql = ["asyncpg>=0.29.0"]
database = [
  "aioboto3>=13.0.0",
  "aiomysql>=0.2.0",
  "asyncpg>=0.29.0",
  "botocore",
  "pymongo>=4.6.0",
  "motor>=3.3.0",
  "oracledb>=2.0.0",
  "pyodbc>=5.3.0",
  "SQLAlchemy",
]
otp_verification = ["asyncpg>=0.29.0"]
# zoneinfo reads the operating system's zone database first. Slim images and
# some CI runners ship one without the legacy aliases (Asia/Calcutta,
# Asia/Katmandu) that calendars still send, so the IANA data comes from PyPI.
outlook_calendar = ["tzdata>=2024.1"]
outlook_email = [
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "pypdf>=6.0.0",
  "rapidfuzz>=3.0.0",
]
trino = ["trino>=0.328.0"]
# `vanna` is pinned exactly, not floored: the connector builds on
# `vanna.legacy`, the pre-2.0 API that 2.x keeps under a new name, and a
# module named legacy is the first thing a release is entitled to move. 2.0.1
# is the version the v1 image ran.
vanna = ["asyncpg>=0.29.0", "openai>=2.15.0,<3", "vanna==2.0.1"]
web_search = ["trafilatura>=1.8.0"]

# Every connector dependency at once. Not for users - a deployment installs
# the one connector it runs - but CI needs it, because the import gate and the
# name-resolution gate are worthless if they skip. Both exist BECAUSE those
# failures shipped: eleven connectors that would not import, and twenty-five
# tools that raised NameError on call while importing perfectly.
all = [
  "magone-mcp-core[cloudflare_r2,csv_to_sql,database,otp_verification,outlook_calendar,outlook_email,trino,vanna,web_search]",
]

[project.urls]
Homepage = "https://github.com/magurelabs/magoneai-mcp"
Source = "https://github.com/magurelabs/magoneai-mcp"
Issues = "https://github.com/magurelabs/magoneai-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magone_mcp_core"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Ported connector code is generated, and its bodies are carried across from v1
# unchanged on purpose: reformatting them would defeat the property that makes
# the port reviewable, which is that the body is the body. Their real gate is
# scripts/port_status.py, which counts unresolved names and only lets that
# number fall.
extend-exclude = ["connectors"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  # Assert is how tests assert; the linter should not fight pytest.
  "S101",
]

[tool.ruff.lint.per-file-ignores]
# S603 is subprocess-with-untrusted-input. A gate test has to run the gate as
# the gate runs in CI, and the argv is `[sys.executable, <constant path>]`
# with no interpolation, so there is no untrusted input to check.
"tests/**" = ["S105", "S106", "S603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `tests/` is the framework suite. `connectors/` holds each connector's own
# tests, ported from the pre-port catalogue; they are listed explicitly rather
# than relying on rootdir discovery so that running plain `pytest` covers both.
testpaths = ["tests", "connectors"]
markers = [
  "requires_connectors: needs the connector third-party dependencies installed, not just the framework's",
]
# `connectors` is a namespace package resolved from the repository root, and a
# test living inside one is collected with its own package on sys.path rather
# than the root. Without this, `from connectors.zoom.server import ...` fails
# at collection with ModuleNotFoundError.
pythonpath = ["."]
