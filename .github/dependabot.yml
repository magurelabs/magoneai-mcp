# Dependency updates, weekly and grouped so they arrive as a few reviewable
# pull requests rather than a stream of single bumps.
#
# Every update is an ordinary pull request: it runs the full CI, needs a
# maintainer's review like any other change, and is never merged
# automatically.
#
# GitHub Actions stay pinned to full commit SHAs. Dependabot updates the SHA
# and the version comment beside it together.
#
# ruff is pinned twice, in the `dev` extra and in ci.yml's "Install ruff"
# step. Dependabot can only update the first, so a ruff bump must update
# ci.yml in the same pull request before it is merged.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # pyproject.toml: the core's dependencies, `dev`, and every connector extra.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
      python-major:
        update-types: ["major"]

  # The Dockerfile pins its base image by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
