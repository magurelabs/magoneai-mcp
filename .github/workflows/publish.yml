# Jobs run on GitHub-hosted runners only. See the note at the top of ci.yml;
# `scripts/runner_label_gate.py` checks this file too.
#
# Every action is pinned to a full commit SHA, with the release it corresponds
# to in a trailing comment.

# Publication pipelines. DRY RUN ONLY.
#
# Nothing here publishes. Every job stops at the step before the one that
# would push, and the push step is present but commented, so the pipeline can
# be read and reviewed in full without being armed.
#
# That is deliberate and it is the whole design. Publishing is the one step in
# this programme that cannot be undone: a version yanked from PyPI still
# cannot be reused, a registry entry is a public claim on a name, and an image
# tag that has been pulled is somewhere forever. So the pipeline is built now,
# while there is time to get it wrong safely, and armed later by a person who
# decides to.
#
# The jobs below DO run, and that is the point: they build the distribution,
# build every publishable image, and validate every manifest against the
# published schema. All of that is worth knowing continuously. None of it
# sends anything anywhere.
#
# The dry-run jobs run on pull requests and hold no secret. Each publish job
# runs only on a manual dispatch, after its dry run passed, and only inside the
# `release` environment, which is protected by required reviewers. A branch
# name is something a contributor can choose; an environment approval is not.
#
# To arm a publish job, someone with that authority does two things and no
# fewer:
#   1. uncomment the push step in the publish job they intend to run
#   2. add the credential that step names to the `release` environment's
#      secrets, never to repository secrets
# Neither happens by accident, and the second is not something CI can do to
# itself.

name: Publish (dry run)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "pyproject.toml"
      - "connectors/*/server.json"

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install build twine

      - name: Build the distribution
        run: python -m build

      # twine check is the closest thing to a publish that is not one: it
      # parses the metadata PyPI would reject on, without contacting PyPI.
      - name: Validate what would be uploaded
        run: twine check dist/*

      - name: Show what would be published
        run: |
          echo "Would upload:"
          ls -la dist/
          python - <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          project = data["project"]
          print(f"  name:    {project['name']}")
          print(f"  version: {project['version']}")
          print(f"  extras:  {sorted(project.get('optional-dependencies', {}))}")
          PY
          echo
          echo "NOT UPLOADING. This pipeline is a dry run."


  images:
    name: Container images (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # This job shells out to `python` to read publication.json. ubuntu-latest
      # ships Python, but pin the version rather than inherit whatever the
      # image happens to carry. The other jobs in this file already do.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Build every publishable connector's image. Building is not publishing,
      # and it is the only way to know the Dockerfile still works for all of
      # them rather than for the one that was tried by hand.
      - name: Build each publishable connector
        run: |
          set -euo pipefail
          ready=$(python -c "
          import json, pathlib
          data = json.loads(pathlib.Path('connectors/publication.json').read_text())
          print(' '.join(sorted(
              name for name, entry in data['connectors'].items()
              if entry.get('status') == 'ready'
          )))
          ")
          for connector in $ready; do
            echo "::group::$connector"
            name=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "connectors/$connector/server.json")
            # The tag is the one the manifest names (docker.io/magoneai/mcp-<name>:<version>),
            # so what is built here is exactly what the registry entry points at.
            image=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['packages'][0]['identifier'])" "connectors/$connector/server.json")
            docker build --build-arg "CONNECTOR=$connector" --build-arg "SERVER_NAME=$name" \
              -t "$image" .
            # The registry's ownership check, run here first: the label must
            # equal the manifest's name, or the publish is refused.
            label=$(docker inspect "$image" \
              --format '{{index .Config.Labels "io.modelcontextprotocol.server.name"}}')
            if [ "$label" != "$name" ]; then
              echo "::error::$connector: image label '$label' != server.json name '$name'"
              exit 1
            fi
            echo "label ok: $label"
            echo "::endgroup::"
          done
          echo "NOT PUSHING. This pipeline is a dry run."


  registry:
    name: MCP Registry (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # The manifests are generated from the connectors, so this re-derives
      # them and fails on any drift before anything could be submitted. A
      # registry entry describing a server that does not exist is the mistake
      # that cannot be withdrawn.
      - name: Every manifest matches its connector
        run: python scripts/gen_server_json.py --check

      - name: A blocked connector carries no manifest
        run: python scripts/publication_gate.py

      - name: Validate each manifest against the published schema
        run: |
          pip install jsonschema requests
          python - <<'PY'
          import json, pathlib, sys
          import requests
          from jsonschema import Draft202012Validator

          url = "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json"
          schema = requests.get(url, timeout=30).json()
          validator = Draft202012Validator(schema)

          manifests = sorted(pathlib.Path("connectors").glob("*/server.json"))
          if not manifests:
              sys.exit("no manifests found; this check would prove nothing")

          failed = False
          for path in manifests:
              errors = sorted(validator.iter_errors(json.loads(path.read_text())), key=str)
              status = "ok" if not errors else "INVALID"
              print(f"  {path.parent.name:24} {status}")
              for error in errors:
                  failed = True
                  print(f"      {'/'.join(str(p) for p in error.path)}: {error.message}")
          print(f"\n{len(manifests)} manifest(s) validated against {url}")
          print("NOT SUBMITTING. This pipeline is a dry run.")
          sys.exit(1 if failed else 0)
          PY

  # ---------------------------------------------------------------------------
  # Publish jobs. Manual dispatch only, after the matching dry run, inside the
  # protected `release` environment. Every push step is still commented out.
  # ---------------------------------------------------------------------------

  publish-pypi:
    name: PyPI (publish)
    needs: pypi
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    # PyPI trusted publishing: the job proves who it is with a short-lived
    # GitHub OIDC token, so no PyPI credential is stored anywhere. Uncomment
    # together with the upload step below, and not before.
    # permissions:
    #   contents: read
    #   id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: echo "NOT UPLOADING. The upload step below is commented out."

      # - name: Upload to PyPI
      #   uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-images:
    name: Container images (publish)
    needs: images
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: echo "NOT PUSHING. The push step below is commented out."

      # - name: Build and push each publishable connector
      #   env:
      #     DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      #     DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      #   run: |
      #     set -euo pipefail
      #     echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      #     ready=$(python -c "import json,pathlib;d=json.loads(pathlib.Path('connectors/publication.json').read_text());print(' '.join(sorted(n for n,e in d['connectors'].items() if e.get('status')=='ready')))")
      #     for connector in $ready; do
      #       name=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "connectors/$connector/server.json")
      #       image=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['packages'][0]['identifier'])" "connectors/$connector/server.json")
      #       docker build --build-arg "CONNECTOR=$connector" --build-arg "SERVER_NAME=$name" -t "$image" .
      #       docker push "$image"
      #     done

  publish-registry:
    name: MCP Registry (publish)
    needs: registry
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: echo "NOT SUBMITTING. The publish step below is commented out."

      # - name: Publish to the MCP Registry
      #   env:
      #     MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
