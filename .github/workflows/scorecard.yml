# OpenSSF Scorecard: https://github.com/ossf/scorecard
#
# Scores this repository against the OpenSSF supply-chain checks (pinned
# dependencies, token permissions, dangerous workflow patterns, branch
# protection and so on), uploads the findings to code scanning, and publishes
# the score that the README badge shows.
#
# It holds no secret. It runs on push to main and weekly, never on a pull
# request, so a fork's code never runs with the OIDC permission it needs.
#
# Every action is pinned to a full commit SHA, with the release it corresponds
# to in a trailing comment. When publishing, the Scorecard API rejects results
# from a job that uses any action outside its allowlist or has a `run` step,
# so the analysis job is only those four actions. Jobs run on GitHub-hosted
# runners only; see the note at the top of ci.yml.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Nothing at workflow level may be writable; each job asks for what it needs.
permissions:
  contents: read

jobs:
  # Code scanning, and publishing to the Scorecard API, are available only to
  # a public repository (or one with GitHub Code Security). Run against a
  # private repository the upload fails, so the analysis waits for the
  # repository to be public instead of turning main red until then. Read from
  # the API because a scheduled run's event payload carries no repository.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - name: Is this repository public
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$REPO" --jq .visibility)"
          echo "visibility: $visibility"
          if [ "$visibility" = "public" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the SARIF results to code scanning.
      security-events: write
      # Publish the results to the Scorecard API, which the badge reads.
      id-token: write
      # Read workflow runs, for the CI-Tests check.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results as an artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
