# Developer Certificate of Origin.
#
# CONTRIBUTING.md asks every commit to carry a `Signed-off-by` line naming its
# author (`git commit -s`). This checks that, for every commit a pull request
# adds, so the requirement is a check rather than a request.
#
# No third-party action and no secret: it reads the commits the pull request
# already contains. `pull_request`, never `pull_request_target`, for the reason
# given at the top of ci.yml.
#
# Dependabot cannot sign off, so its pull requests would fail a required
# check they have no way to pass. The job still runs, so "Sign-off" reports a
# result, and the check step is skipped when the pull request's author is
# dependabot[bot]. Its pull requests still need a maintainer's review.

name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot cannot sign off, so its pull requests are not checked
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Pull request by dependabot[bot]; sign-off check skipped."
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range below needs both ends and everything between them.
          fetch-depth: 0
      - name: Every commit is signed off by its author
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -qxF "$author"; then
              echo "ok      $sha  $author"
            else
              echo "::error::$sha has no 'Signed-off-by: $author' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign each commit with 'git commit -s'. To fix existing commits:"
            echo "  git rebase --signoff $BASE"
            exit 1
          fi
