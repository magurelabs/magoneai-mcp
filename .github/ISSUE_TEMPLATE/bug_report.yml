name: Bug report
description: A connector or the framework does something it should not, or fails to do what it says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Security issues do not belong here.** If this could let someone misuse a credential, reach an internal address, bypass read-only mode or tool selection, or read another caller's data, report it privately instead: see SECURITY.md.

        Never paste a token, API key, refresh token or private URL into an issue. Redact them.
  - type: input
    id: connector
    attributes:
      label: Connector
      description: The directory under `connectors/`, or `magone-mcp-core` for the framework.
      placeholder: e.g. linear
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool name, if the problem is in one tool.
      placeholder: e.g. get_issue
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include the tool arguments (with secrets removed) and the result or error.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. pip install -e ".[linear]"
        2. MCP_MODE=local python -m connectors.linear
        3. call get_issue with ...
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD` in your checkout.
  - type: dropdown
    id: mode
    attributes:
      label: MCP_MODE
      options:
        - local
        - platform
        - hosted
        - not sure
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, operating system, and the MCP client you used.
      placeholder: Python 3.11.9, macOS 15, MCP Inspector
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server log lines, with credentials removed.
      render: text
